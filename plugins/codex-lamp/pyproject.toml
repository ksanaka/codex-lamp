[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-lamp"
version = "0.1.0"
description = "Drive a Moonside Halo from Codex lifecycle events"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22,<2"]

[project.scripts]
codex-lamp = "codex_lamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
